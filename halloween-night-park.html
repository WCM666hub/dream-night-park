<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dream Night Park · 万圣夜 / 童话夜</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #160d2b;
  }
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: var(--ink);
  }
  body {
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    outline: none;
    touch-action: none;
  }
  body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% 44%, rgba(34, 16, 54, 0) 43%, rgba(34, 16, 54, 0.1) 69%, rgba(34, 16, 54, 0.38) 100%);
  }
  #theme-toggle {
    position: fixed;
    top: max(18px, env(safe-area-inset-top));
    right: max(18px, env(safe-area-inset-right));
    z-index: 5;
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 15px 10px 13px;
    border: 1px solid rgba(255, 224, 174, 0.55);
    border-radius: 999px;
    background: linear-gradient(135deg, rgba(44, 22, 63, 0.78), rgba(22, 13, 35, 0.72));
    box-shadow: 0 8px 30px rgba(12, 5, 24, 0.34), inset 0 0 18px rgba(255, 199, 232, 0.06);
    color: #ffe9bf;
    font: 600 13px/1.1 "Georgia", "Songti SC", serif;
    letter-spacing: 0.06em;
    cursor: pointer;
    backdrop-filter: blur(12px) saturate(1.2);
    -webkit-backdrop-filter: blur(12px) saturate(1.2);
    transition: transform 180ms ease, border-color 220ms ease, background 260ms ease, box-shadow 260ms ease;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #theme-toggle:hover {
    transform: translateY(-1px);
    border-color: rgba(255, 238, 194, 0.92);
    box-shadow: 0 10px 34px rgba(12, 5, 24, 0.42), 0 0 22px rgba(255, 184, 226, 0.16);
  }
  #theme-toggle:active { transform: translateY(0) scale(0.98); }
  #theme-toggle:focus-visible { outline: 2px solid rgba(255, 223, 164, 0.9); outline-offset: 3px; }
  #theme-toggle .theme-icon {
    display: grid;
    place-items: center;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    font-size: 14px;
    background: rgba(255, 202, 235, 0.12);
    color: #ffd38d;
  }
  #theme-toggle .theme-switch {
    opacity: 0.62;
    font-size: 12px;
    letter-spacing: 0;
    margin-left: 1px;
  }
  body[data-theme="halloween"] #theme-toggle {
    border-color: rgba(255, 190, 112, 0.6);
    background: linear-gradient(135deg, rgba(39, 18, 52, 0.9), rgba(17, 9, 25, 0.82));
    color: #ffdca0;
    box-shadow: 0 8px 30px rgba(4, 2, 10, 0.46), 0 0 24px rgba(255, 121, 36, 0.1);
  }
  body[data-theme="halloween"] #theme-toggle .theme-icon {
    color: #ffb35c;
    background: rgba(255, 161, 70, 0.13);
  }
  @media (max-width: 520px) {
    #theme-toggle { top: 12px; right: 12px; padding: 8px 12px 8px 10px; font-size: 12px; }
    #theme-toggle .theme-switch { display: none; }
  }
</style>
</head>
<body data-theme="fairy">
<button id="theme-toggle" type="button" aria-label="切换万圣夜与梦幻童话风格">
  <span class="theme-icon" aria-hidden="true">✦</span>
  <span class="theme-label">童话夜</span>
  <span class="theme-switch" aria-hidden="true">⇄</span>
</button>
